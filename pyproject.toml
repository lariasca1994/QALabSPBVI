[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qalabspbvi"
version = "0.1.0"
description = "Laboratorio local de pagos inmediatos interoperables y aseguramiento de calidad."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "argon2-cffi>=23.1,<26.0",
    "boto3>=1.35,<2.0",
    "email-validator>=2.2,<3.0",
    "httpx>=0.27,<1.0",
    "jsonschema>=4.23,<5.0",
    "lxml>=5.3,<7.0",
    "oracledb>=2.5,<5.0",
    "pymongo>=4.10,<5.0",
    "pymysql>=1.1,<2.0",
    "certifi>=2024.8",
    "pydantic-settings>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pyodbc>=5.2,<6.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4.0"]
dev = ["mongomock>=4.2,<5.0", "pytest>=8.3,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.domains.iso20022" = ["schemas/*.xsd"]
