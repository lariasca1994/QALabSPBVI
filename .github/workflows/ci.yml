name: CI

on:
  push:
    # La rama production la escribe el job de producción; no vuelve a probarse.
    branches-ignore:
      - production
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Pruebas backend
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias de prueba
        run: python -m pip install -e ".[dev]"

      - name: Ejecutar pruebas
        run: python -m pytest -q

  frontend-and-e2e:
    name: Build React y pruebas de navegador
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias del backend aislado E2E
        run: python -m pip install -e ".[dev]"

      - name: Instalar dependencias React
        working-directory: web
        run: npm ci

      - name: Compilar React y TypeScript
        working-directory: web
        run: npm run build

      - name: Instalar Chromium para Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Ejecutar recorridos E2E
        working-directory: web
        env:
          QALAB_E2E_PYTHON: python
        run: npm run test:e2e

  deploy-lab:
    name: Desplegar laboratorio
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.LAB_DEPLOY_ENABLED == 'true'
    needs:
      - backend-tests
      - frontend-and-e2e
    runs-on: ubuntu-24.04
    environment: lab
    permissions:
      contents: read
      id-token: write
      packages: write
    # Todo el despliegue usa capas gratuitas: imágenes en GHCR (repo público), API en
    # Azure Container Apps, interfaz en Vercel (se publica sola con la integración de Git),
    # avisos en AWS Lambda y gateway ISO 20022 en Render.
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en GitHub Container Registry
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publicar imágenes inmutables (API y gateway ISO 20022)
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          api="ghcr.io/$owner/qalabspbvi-api:$GITHUB_SHA"
          gateway="ghcr.io/$owner/qalabspbvi-iso20022-gateway:$GITHUB_SHA"
          docker build --pull --tag "$api" .
          docker build --pull --file services/iso20022_gateway/Dockerfile --tag "$gateway" .
          docker push "$api"
          docker push "$gateway"
          echo "IMAGE=$api" >> "$GITHUB_ENV"
          echo "GATEWAY_IMAGE=$gateway" >> "$GITHUB_ENV"

      - name: Comprobar que la imagen se descarga sin credenciales
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io
          docker pull --quiet "$IMAGE" > /dev/null
          echo "La imagen es pública: Azure la puede descargar sin registro configurado."

      - name: Iniciar sesion en Azure con OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Actualizar Azure Container App
        shell: bash
        env:
          RESOURCE_GROUP: ${{ vars.LAB_RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.LAB_CONTAINER_APP_NAME }}
        run: |
          set -euo pipefail
          az containerapp update             --resource-group "$RESOURCE_GROUP"             --name "$CONTAINER_APP_NAME"             --image "$IMAGE"

      - name: Iniciar sesion en AWS con OIDC
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publicar la Lambda de avisos en AWS
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        shell: bash
        run: |
          set -euo pipefail
          cd services/notifier
          zip -q ../../notifier.zip handler.py
          cd ../..
          aws lambda update-function-code --function-name qalabspbvi-notifier             --zip-file fileb://notifier.zip --query LastUpdateStatus --output text
          aws lambda wait function-updated --function-name qalabspbvi-notifier

      - name: Publicar el gateway ISO 20022 en Render
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "Sin credenciales de Render: se omite el gateway."
            exit 0
          fi
          # Render despliega la imagen pública de GHCR etiquetada con este commit.
          curl --fail --silent --show-error -X POST             -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json"             -d "{\"imageUrl\": \"$GATEWAY_IMAGE\"}"             "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" > /dev/null
          echo "Despliegue del gateway solicitado a Render."

      - name: Comprobar la ruta publica de la API
        shell: bash
        env:
          PUBLIC_APP_URL: ${{ vars.LAB_PUBLIC_APP_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors             "$PUBLIC_APP_URL/api/health"

      - name: Comprobar que el frontend publicado es la compilación
        shell: bash
        env:
          PUBLIC_APP_URL: ${{ vars.LAB_PUBLIC_APP_URL }}
        run: |
          set -euo pipefail
          # El index.html compilado referencia /assets/index-*.js; el de código fuente, /src/main.tsx.
          for attempt in $(seq 1 12); do
            if curl --fail --silent "$PUBLIC_APP_URL/" | grep -q '/assets/index-'; then
              echo "Frontend compilado publicado."
              exit 0
            fi
            sleep 10
          done
          echo "El frontend publicado no es la compilación de web/dist." >&2
          exit 1

  deploy-production:
    name: Desplegar producción
    # Misma imagen que ya pasó por el laboratorio; el environment "production" exige aprobación.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PROD_DEPLOY_ENABLED == 'true'
    needs:
      - deploy-lab
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Fijar la imagen ya publicada por el laboratorio
        shell: bash
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/$owner/qalabspbvi-api:$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Iniciar sesion en Azure con OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Actualizar la Container App de producción
        shell: bash
        env:
          RESOURCE_GROUP: ${{ vars.PROD_RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.PROD_CONTAINER_APP_NAME }}
        run: |
          set -euo pipefail
          az containerapp update --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_APP_NAME" --image "$IMAGE"

      - name: Iniciar sesion en AWS con OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publicar la Lambda de avisos de producción
        shell: bash
        run: |
          set -euo pipefail
          cd services/notifier
          zip -q ../../notifier.zip handler.py
          cd ../..
          aws lambda update-function-code --function-name qalabspbvi-prod-notifier \
            --zip-file fileb://notifier.zip --query LastUpdateStatus --output text
          aws lambda wait function-updated --function-name qalabspbvi-prod-notifier

      - name: Publicar la interfaz de producción (rama production)
        shell: bash
        env:
          PROD_API_ORIGIN: ${{ vars.PROD_API_ORIGIN }}
        run: |
          set -euo pipefail
          # El proyecto de Vercel de producción solo construye la rama "production". Este job
          # (ya aprobado) la reescribe con este commit y el proxy /api hacia la API de producción.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B production
          jq --arg api "$PROD_API_ORIGIN/:path*" '.rewrites[0].destination = $api' web/vercel.json > /tmp/vercel.json
          mv /tmp/vercel.json web/vercel.json
          git add web/vercel.json
          git commit -m "Producción: $GITHUB_SHA con proxy /api hacia la API de producción"
          git push --force origin production

      - name: Esperar la publicación de Vercel
        shell: bash
        env:
          PUBLIC_APP_URL: ${{ vars.PROD_PUBLIC_APP_URL }}
        run: sleep 60

      - name: Comprobar la ruta publica de producción
        shell: bash
        env:
          PUBLIC_APP_URL: ${{ vars.PROD_PUBLIC_APP_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "$PUBLIC_APP_URL/api/health"
