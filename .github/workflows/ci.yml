name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Pruebas backend
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias de prueba
        run: python -m pip install -e ".[dev]"

      - name: Ejecutar pruebas
        run: python -m pytest -q

  frontend-and-e2e:
    name: Build React y pruebas de navegador
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias del backend aislado E2E
        run: python -m pip install -e ".[dev]"

      - name: Instalar dependencias React
        working-directory: web
        run: npm ci

      - name: Compilar React y TypeScript
        working-directory: web
        run: npm run build

      - name: Instalar Chromium para Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Ejecutar recorridos E2E
        working-directory: web
        env:
          QALAB_E2E_PYTHON: python
        run: npm run test:e2e
