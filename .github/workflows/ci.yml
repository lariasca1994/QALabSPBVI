name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Pruebas backend
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias de prueba
        run: python -m pip install -e ".[dev]"

      - name: Ejecutar pruebas
        run: python -m pytest -q

  frontend-and-e2e:
    name: Build React y pruebas de navegador
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias del backend aislado E2E
        run: python -m pip install -e ".[dev]"

      - name: Instalar dependencias React
        working-directory: web
        run: npm ci

      - name: Compilar React y TypeScript
        working-directory: web
        run: npm run build

      - name: Instalar Chromium para Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Ejecutar recorridos E2E
        working-directory: web
        env:
          QALAB_E2E_PYTHON: python
        run: npm run test:e2e

  deploy-lab:
    name: Desplegar laboratorio
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.LAB_DEPLOY_ENABLED == 'true'
    needs:
      - backend-tests
      - frontend-and-e2e
    runs-on: ubuntu-24.04
    environment: lab
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias React
        working-directory: web
        run: npm ci

      - name: Compilar React
        working-directory: web
        run: npm run build

      - name: Iniciar sesion en Azure con OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publicar imagen inmutable de la API
        shell: bash
        env:
          ACR_NAME: ${{ vars.LAB_ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ vars.LAB_ACR_LOGIN_SERVER }}
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"
          image="$ACR_LOGIN_SERVER/qalabspbvi-api:$GITHUB_SHA"
          docker build --pull --tag "$image" .
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Actualizar Azure Container App
        shell: bash
        env:
          RESOURCE_GROUP: ${{ vars.LAB_RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.LAB_CONTAINER_APP_NAME }}
        run: |
          set -euo pipefail
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" \
            --image "$IMAGE"

      - name: Iniciar sesion en AWS con OIDC
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publicar la Lambda de avisos en AWS
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        shell: bash
        run: |
          set -euo pipefail
          cd services/notifier
          zip -q ../../notifier.zip handler.py
          cd ../..
          aws lambda update-function-code --function-name qalabspbvi-notifier \
            --zip-file fileb://notifier.zip --query LastUpdateStatus --output text
          aws lambda wait function-updated --function-name qalabspbvi-notifier

      - name: Iniciar sesion en Google Cloud con Workload Identity
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Configurar gcloud
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/setup-gcloud@v2

      - name: Publicar el gateway ISO 20022 en Cloud Run
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        shell: bash
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          set -euo pipefail
          image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/qalabspbvi/iso20022-gateway:$GITHUB_SHA"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build --pull --file services/iso20022_gateway/Dockerfile --tag "$image" .
          docker push "$image"
          gcloud run deploy iso20022-gateway --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --image "$image" --quiet
          url="$(gcloud run services describe iso20022-gateway --project "$GCP_PROJECT" \
            --region "$GCP_REGION" --format 'value(status.url)')"
          curl --fail --silent --show-error --retry 6 --retry-delay 5 "$url/health"

      - name: Publicar React en Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.LAB_STATIC_WEB_APPS_DEPLOYMENT_TOKEN }}
          action: upload
          # Con skip_app_build la acción sube app_location tal cual: debe ser la carpeta compilada.
          app_location: web/dist
          api_location: ""
          output_location: ""
          skip_app_build: true

      - name: Comprobar la ruta publica de la API
        shell: bash
        env:
          PUBLIC_APP_URL: ${{ vars.LAB_PUBLIC_APP_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors \
            "$PUBLIC_APP_URL/api/health"

      - name: Comprobar que el frontend publicado es la compilación
        shell: bash
        env:
          PUBLIC_APP_URL: ${{ vars.LAB_PUBLIC_APP_URL }}
        run: |
          set -euo pipefail
          # El index.html compilado referencia /assets/index-*.js; el de código fuente, /src/main.tsx.
          for attempt in $(seq 1 12); do
            if curl --fail --silent "$PUBLIC_APP_URL/" | grep -q '/assets/index-'; then
              echo "Frontend compilado publicado."
              exit 0
            fi
            sleep 10
          done
          echo "El frontend publicado no es la compilación de web/dist." >&2
          exit 1
