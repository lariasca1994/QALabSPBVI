name: Depuración quincenal

# Cada 15 días (días 1 y 16 de cada mes) borra lo que se acumula con los despliegues:
#   - imágenes viejas en GitHub Container Registry: se conservan las 5 más recientes, que
#     incluyen la que está en producción y las anteriores para volver atrás;
#   - cachés de GitHub Actions sin usar en 15 días.
# Corre con el token del propio repositorio: no necesita secretos.
on:
  schedule:
    - cron: '0 6 1,16 * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  depurar:
    runs-on: ubuntu-latest
    steps:
      - name: Imágenes viejas de qalabspbvi-api (se conservan las 5 más recientes)
        uses: actions/delete-package-versions@v5
        with:
          package-name: qalabspbvi-api
          package-type: container
          min-versions-to-keep: 5
      - name: Imágenes viejas de qalabspbvi-iso20022-gateway (se conservan las 5 más recientes)
        uses: actions/delete-package-versions@v5
        with:
          package-name: qalabspbvi-iso20022-gateway
          package-type: container
          min-versions-to-keep: 5
      - name: Cachés de Actions sin usar en 15 días
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          limite=$(date -u -d '15 days ago' +%s)
          gh api --paginate "repos/${{ github.repository }}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | "\(.id) \(.last_accessed_at)"' | while read -r id fecha; do
            if [ "$(date -u -d "$fecha" +%s)" -lt "$limite" ]; then
              gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" > /dev/null && echo "caché $id borrada"
            fi
          done
