services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://qalab:qalab_local_only@db:5432/qalab
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qalab
      POSTGRES_USER: qalab
      POSTGRES_PASSWORD: qalab_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qalab -d qalab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
